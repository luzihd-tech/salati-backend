# Netlify ne remet l'app en ligne que si l'app elle-même a changé
# (un changement du serveur ou de la liste des lieux ne consomme pas de crédit Netlify).
# Sans build précédent connu, Netlify donne le même commit des deux côtés : on publie alors toujours.
[build]
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html admin.html manifest.webmanifest sw.js icons/"
